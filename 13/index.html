<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Introdução ao CSS3</title>
    <link rel="stylesheet" href="normalize.css">
</head>

<style>
    /* Estilo original, que se aplica à primeira caixa */
    .box {
        background: #b9c941;
        width: 300px;
        height: 140px;
        padding: 10px;
        margin: 10px;
        border-radius: 10px 40px;
        -webkit-border-radius: 20px;
        -moz-border-radius: 20px;
    }

    /* NOVO ESTILO - Aplicado SOMENTE à caixa com a classe .box-button.
      Ele é mais escuro e tem propriedades para parecer um botão.
    */
    .box-button {
        background: #03310b; /* Cor de fundo escura, de botão */
        color: #fff; /* Cor do texto branca para contraste */
        cursor: pointer;
        
        /* Centraliza o conteúdo verticalmente e horizontalmente */
        display: flex;
        justify-content: center;
        align-items: center;

        /* Efeito de transição suave para o hover */
        transition: background-color 0.3s, transform 0.2s;
    }

    /* Efeito ao passar o mouse SOMENTE no botão */
    .box-button:hover {
        background: #555; /* Clareia o fundo */
        transform: translateY(-3px); /* Leve elevação */
    }

    /* Ajuste para a legenda dentro do botão */
    .box-button fieldset {
        border-color: #666;
    }

    .box-button legend {
       color: #fff;
       font-weight: bold;
    }
</style>

<body>
    <header>
        <h1>Introdução ao CSS3</h1>
    </header>

    <div class="box">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>Nome: <input type="text" /></p>
            <p>E-mail: <input type="text" /></p>
        </fieldset>
    </div>

    <div class="box box-button" onclick="window.open('../13.2/index.html', '_blank')">
        <fieldset>
            <legend>Exercício - Propiedades box-sizing</legend>
            <p style="text-align: center;">Box Sizing</p>
        </fieldset>
    </div>

</body>
</html>
