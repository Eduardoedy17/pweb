<!doctype html> <!-- Define que o documento é do tipo HTML5 -->
<html lang="pt-BR"> <!-- Define o idioma como português do Brasil -->

<head>
  <meta charset="utf-8"> <!-- Codificação de caracteres UTF-8, compatível com acentos e símbolos -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Torna o layout responsivo em dispositivos móveis -->
  <title>Imagens Responsiva | Formas em Imagens</title> <!-- Título da página exibido na aba do navegador -->

  <!-- Importa o CSS do Bootstrap para usar estilos e classes pré-definidas -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Importa ícones da biblioteca Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Importa um arquivo CSS personalizado (presumivelmente chamado style.css) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Container central do Bootstrap que fornece espaçamento lateral -->
  <div class="container">
    
    <!-- Primeira linha com duas colunas para mostrar comparação de imagens -->
    <div class="row">
      <div class="col-sm-6"> <!-- Coluna que ocupa metade da largura em telas pequenas -->
        <h1>Imagem Responsiva</h1> <!-- Título da seção -->
        <img src="uvas.png" class="img-fluid"> <!-- Imagem que se adapta ao contêiner usando Bootstrap -->
      </div>

      <div class="col-sm-6"> <!-- Segunda coluna igualmente distribuída -->
        <h1>Imagem Não Responsiva</h1> <!-- Título da seção -->
        <img src="uvas.png"> <!-- Imagem comum, sem a classe de responsividade -->
      </div>
    </div>

    <!-- Segunda linha com uma coluna completa para mostrar imagens com formas -->
    <div class="row">
      <div class="col-sm-12"> <!-- Coluna que ocupa 100% da largura em telas pequenas -->
        <h1>Formas em Imagem</h1> <!-- Título da seção -->
        <img src="uvas200.png" class="rounded-circle"> <!-- Imagem com bordas circulares (ideal para avatar) -->
        <img src="uvas200.png" class="rounded"> <!-- Imagem com bordas levemente arredondadas -->
      </div>
    </div>

    <hr> <!-- Linha horizontal para separar conteúdo visualmente -->
  </div>

  <!-- Importa os scripts JavaScript do Bootstrap para funcionalidades interativas como modais e carrosséis -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
