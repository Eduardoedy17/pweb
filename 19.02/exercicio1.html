<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imagens Responsiva | Formas em Imagens</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
      <div class="container">
        <div class="row">
            <div class="col-sm-6">
                <h1> Imagem Responsiva</h1>
                <img src="uvas.png" class="img-fluid">
            </div>
            <div class="col-sm-6">
                <h1> Imagem Não Responsiva </h1>
                <img src="uvas.png">
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <h1> Formas em Imagem </h1>
                <img src="uvas200.png" class="rounded-circle">
                <img src="uvas200.png" class="rounded">
            </div>
        </div>
        <hr>
    </div>

    <!-- Importa os scripts JS do Bootstrap para funcionalidades como validação, modais, etc. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
