<!doctype html> <!-- Define que o documento usa o padrão HTML5 -->
<html lang="pt-BR"> <!-- Define que o idioma principal da página é português do Brasil -->

<head>
    <meta charset="utf-8"> <!-- Define a codificação como UTF-8 para suportar caracteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Faz a página se adaptar corretamente em dispositivos móveis -->
    <title>Perfil de Usuário</title> <!-- Define o título que aparecerá na aba do navegador -->

    <!-- Importa o CSS do Bootstrap para estilos e componentes responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importa a biblioteca de ícones do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background-color: #f0f2f5; /* Define a cor de fundo da página */
            display: flex; /* Usa Flexbox para alinhar o conteúdo */
            justify-content: center; /* Centraliza horizontalmente */
            align-items: center; /* Centraliza verticalmente */
            min-height: 100vh; /* Define altura mínima de 100% da tela */
            padding: 2rem; /* Espaçamento interno */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fonte usada no conteúdo */
        }

        .profile-pic-container {
            position: relative; /* Permite posicionar elementos filhos de forma absoluta */
            width: 120px; /* Largura da imagem de perfil */
            height: 120px; /* Altura da imagem de perfil */
            margin: 0 auto 1rem; /* Centraliza horizontalmente e adiciona margem inferior */
        }

        .profile-pic-container a {
            display: block; /* Faz o link ocupar todo o espaço */
            cursor: pointer; /* Muda o cursor para indicar que é clicável */
        }

        .online-status {
            position: absolute; /* Posiciona o indicador em relação ao container */
            bottom: 5px; /* Alinha o círculo ao fundo da imagem */
            right: 5px; /* Alinha o círculo à direita da imagem */
            width: 18px; /* Tamanho do indicador */
            height: 18px;
            background-color: #28a745; /* Cor verde que simboliza "online" */
            border-radius: 50%; /* Transforma em um círculo */
            border: 2px solid white; /* Borda branca para destacá-lo sobre a imagem */
            z-index: 10; /* Garante que o círculo fique acima da imagem */
        }
    </style>
</head>

<body>
    <main>
        <!-- Estrutura principal do cartão de perfil -->
        <article class="card shadow border-0" style="width: 23rem;">
            
            <!-- Cabeçalho do cartão -->
            <div class="card-header bg-white border-0 py-3">
                <h2 class="h5 mb-0 text-muted">Perfil de Usuário</h2> <!-- Título do cartão -->
            </div>

            <!-- Corpo do cartão: imagem + nome + informações básicas -->
            <div class="card-body text-center">
                <div class="profile-pic-container">
                    <!-- Link que abre o modal ao clicar na imagem -->
                    <a href="#" data-bs-toggle="modal" data-bs-target="#profileModal">
                        <img src="./perfil.jpg" 
                             alt="Foto de Eduardo Sousa" 
                             class="img-fluid rounded-circle shadow-sm" 
                             style="width: 120px; height: 120px; object-fit: cover;"> <!-- Imagem circular com sombra -->
                        <span class="online-status" title="Online"></span> <!-- Indicador verde de status online -->
                    </a>
                </div>

                <!-- Nome do usuário e profissão -->
                <h3 class="card-title h4">Eduardo Sousa</h3>
                <p class="card-subtitle text-muted">Engenheiro de Software</p>
                <p class="text-muted small mt-2">
                    <i class="fa-solid fa-location-dot me-1"></i> Teresina, Piauí, Brasil <!-- Ícone + localização -->
                </p>
            </div>

            <!-- Lista de seguidores, seguindo e amigos -->
            <ul class="list-group list-group-flush px-4">
                <li class="list-group-item d-flex justify-content-between align-items-center border-top">
                    <span class="text-muted">Seguidores</span>
                    <span class="fw-bold text-primary">1,322</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="text-muted">Seguindo</span>
                    <span class="fw-bold text-primary">543</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="text-muted">Amigos</span>
                    <span class="fw-bold text-primary">13.287</span>
                </li>
            </ul>

            <!-- Habilidades do usuário com botões estilizados -->
            <div class="card-body text-center border-top">
                <h6 class="text-muted mb-3">Principais Habilidades</h6>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <a href="#" class="btn btn-outline-primary btn-sm rounded-pill">React</a>
                    <a href="#" class="btn btn-outline-primary btn-sm rounded-pill">Node.js</a>
                    <a href="#" class="btn btn-outline-primary btn-sm rounded-pill">TypeScript</a>
                    <a href="#" class="btn btn-outline-primary btn-sm rounded-pill">Cloud</a>
                </div>
            </div>

            <!-- Rodapé com links sociais -->
            <div class="card-footer bg-white text-center py-3">
                <a href="#" class="text-body-secondary mx-2" title="GitHub"><i class="fab fa-github fa-lg"></i></a>
                <a href="#" class="text-body-secondary mx-2" title="LinkedIn"><i class="fab fa-linkedin fa-lg"></i></a>
                <a href="#" class="text-body-secondary mx-2" title="Website"><i class="fas fa-globe fa-lg"></i></a>
            </div>

            <!-- Botões de interação com o perfil -->
            <div class="card-body bg-light border-top">
                <div class="d-flex gap-2">
                    <a href="#" class="btn btn-primary w-100 py-2">Seguir</a> <!-- Botão principal -->
                    <a href="#" class="btn btn-outline-secondary w-100 py-2">Mensagem</a> <!-- Botão secundário -->
                </div>
            </div>
        </article>
    </main>

    <!-- Modal que exibe imagem ampliada do perfil -->
    <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg"> <!-- Modal grande centralizado -->
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="profileModalLabel">Eduardo Sousa</h5> <!-- Título do modal -->
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> <!-- Botão para fechar -->
          </div>
          <div class="modal-body text-center">
            <img src="./perfil.jpg" class="img-fluid w-100" alt="Foto ampliada de Eduardo Sousa"> <!-- Imagem no modal -->
          </div>
        </div>
      </div>
    </div>

    <!-- Script do Bootstrap que ativa o funcionamento do modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
