<!doctype html> <!-- Define o tipo de documento como HTML5 -->

<html lang="pt-BR"> <!-- Início do documento HTML, com o idioma definido como português brasileiro -->

<head>
  <meta charset="utf-8">
  <!-- Define a codificação de caracteres para UTF-8, permitindo acentuação e caracteres especiais -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Torna a página responsiva, adaptável a telas menores -->
  <title>Botões e Imagens Responsivas</title> <!-- Título que aparece na aba do navegador -->

  <!-- Importa o CSS do Bootstrap via CDN para utilizar os estilos e componentes -->

  <!-- Importa o arquivo normalize.css para remover inconsistências de estilo entre navegadores -->

</head>

<body>

      <div class="col-sm-6">

      </div>

      <div class="col-sm-6">
        <h1>Tipos de Botões</h1>
        <button class="btn btn-default btn-xs">Botão</button>

        <button class="btn btn-success btn-md">Botão</button>
        <button class="btn btn-danger btn-lg">Botão</button>

        <button class="btn btn-warning">Botão</button>

        -->

            <section class="mt-5 text-center"> <!-- Margem no topo e centralização do texto -->

</html>
