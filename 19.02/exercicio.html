<!doctype html> <!-- Define que o documento segue o padrão HTML5 -->
<html lang="pt-BR"> <!-- Define o idioma da página como português brasileiro -->

<head>
  <meta charset="utf-8"> <!-- Codificação dos caracteres para suportar acentuação e símbolos -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Faz com que o layout seja responsivo em dispositivos móveis -->
  <title>Botões com Bootstrap</title> <!-- Título da página exibido na aba do navegador -->

  <!-- Importa o CSS do Bootstrap para acesso a componentes e classes utilitárias -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Importa biblioteca de ícones Font Awesome versão beta -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Link opcional para um arquivo CSS personalizado local chamado "style.css" -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">
  <!-- Aplica classes do Bootstrap para centralizar vertical e horizontalmente o conteúdo na tela inteira -->

  <div class="text-center"> <!-- Container que centraliza o conteúdo e textos -->
    <h1>Application Buttons</h1> <!-- Título principal exibido na página -->

    <!-- Container com botões alinhados com espaçamento e quebra de linha automática -->
    <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
      
      <!-- Botão personalizado com ícone de edição -->
      <button class="btn-custom">
        <i class="fa-solid fa-edit"></i> <!-- Ícone de editar (Font Awesome) -->
        <span>Edit</span> <!-- Texto visível no botão -->
      </button>

      <!-- Botão com ícone de "play" -->
      <button class="btn-custom">
        <i class="fa-solid fa-play"></i>
        <span>Play</span>
      </button>

      <!-- Botão com ícone de "repetir" -->
      <button class="btn-custom">
        <i class="fa-solid fa-repeat"></i>
        <span>Repeat</span>
      </button>

      <!-- Botão com ícone de "pause" -->
      <button class="btn-custom">
        <i class="fa-solid fa-pause"></i>
        <span>Pause</span>
      </button>

      <!-- Botão com ícone de "salvar" -->
      <button class="btn-custom">
        <i class="fa-solid fa-save"></i>
        <span>Save</span>
      </button>
    </div>
  </div>

</body>
</html>
