<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Pacotes - JM Viagens</title>
</head>

<body>

    <!-- Cabeçalho -->
    <table border="0" width="100%" cellpadding="10" cellspacing="5">
        <tr>
            <td>
                <img src="imagens/logo.png" width="50%">
            </td>
            <td align="right">
                <a href="index.html">Home</a> |
                <a href="quem-somos.html">Quem Somos</a> |
                <a href="contato.html">Contato</a> |
                <a href="destinos.html">Destinos</a> |
                <a href="buscar-pacotes.html">Buscar Pacotes</a> |
                <a href="cadastro.html">Cadastre-se</a>
            </td>
        </tr>
    </table>

    <!-- Formulário de busca de pacotes -->
    <table border="1" width="50%" align="center" cellpadding="10" cellspacing="5">
        <tr>
            <td colspan="2" align="center"><h1>Buscar Pacotes de Viagem</h1></td>
        </tr>
        <tr>
            <td><label for="origem">Origem:</label></td>
            <td><input type="text" id="origem" name="origem" required></td>
        </tr>
        <tr>
            <td><label for="destino">Destino:</label></td>
            <td><input type="text" id="destino" name="destino" required></td>
        </tr>
        <tr>
            <td><label for="data-partida">Data de Partida:</label></td>
            <td><input type="date" id="data-partida" name="data-partida" required></td>
        </tr>
        <tr>
            <td><label for="data-retorno">Data de Retorno:</label></td>
            <td><input type="date" id="data-retorno" name="data-retorno" required></td>
        </tr>
        <tr>
            <td><label for="quartos">Quartos:</label></td>
            <td><input type="number" id="quartos" name="quartos" min="1" required></td>
        </tr>
        <tr>
            <td><label for="adultos">Quantidade de Adultos:</label></td>
            <td><input type="number" id="adultos" name="adultos" min="1" required></td>
        </tr>
        <tr>
            <td><label for="criancas">Quantidade de Crianças:</label></td>
            <td><input type="number" id="criancas" name="criancas" min="0"></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <button type="submit">Buscar Pacote</button>
            </td>
        </tr>
    </table>

    <!-- Rodapé -->
    <table border="0" width="100%" cellpadding="10" cellspacing="5">
        <tr>
            <td align="center">
                <h4>Todos os direitos reservados</h4>
            </td>
        </tr>
    </table>

</body>

</html>
