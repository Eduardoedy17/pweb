<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Pacotes - JM Viagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        .container {
            width: 50%;
            margin: auto;
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label, input, select {
            width: 100%;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <!-- Cabeçalho -->
    <table border="0" width="100%" cellpadding="10" cellspacing="5">
        <tr>
            <td>
                <img src="imagens/logo.png" width="50%">
            </td>
            <td align="right">
                <a href="index.html">Home</a> |
                <a href="quem-somos.html">Quem Somos</a> |
                <a href="contato.html">Contato</a> |
                <a href="destinos.html">Destinos</a> |
                <a href="buscar-pacotes.html">Buscar Pacotes</a> |
                <a href="cadastro.html">Cadastre-se</a>
            </td>
        </tr>
    </table>

    <!-- Formulário de busca de pacotes -->
    <div class="container">
        <h1>Buscar Pacotes de Viagem</h1>
        <form action="#" method="POST">
            <label for="origem">Origem:</label>
            <input type="text" id="origem" name="origem" required>

            <label for="destino">Destino:</label>
            <input type="text" id="destino" name="destino" required>

            <label for="data-partida">Data de Partida:</label>
            <input type="date" id="data-partida" name="data-partida" required>

            <label for="data-retorno">Data de Retorno:</label>
            <input type="date" id="data-retorno" name="data-retorno" required>

            <label for="quartos">Quartos:</label>
            <input type="number" id="quartos" name="quartos" min="1" required>

            <label for="adultos">Quantidade de Adultos:</label>
            <input type="number" id="adultos" name="adultos" min="1" required>

            <label for="criancas">Quantidade de Crianças:</label>
            <input type="number" id="criancas" name="criancas" min="0">

            <br>

            <button type="submit">Buscar Pacote</button>
        </form>
    </div>

    <!-- Rodapé -->
    <table border="0" width="100%" cellpadding="10" cellspacing="5">
        <tr>
            <td align="center">
                <h4>Todos os direitos reservados</h4>
            </td>
        </tr>
    </table>

</body>

</html>
