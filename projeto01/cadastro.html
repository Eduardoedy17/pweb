<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se - JM Viagens</title>
</head>

<body>

    <!-- Cabeçalho -->
    <table border="0" width="100%" cellpadding="10" cellspacing="5">
        <tr>
            <td>
                <img src="imagens/logo.png" width="50%">
            </td>
            <td align="right">
                <a href="index.html">Home</a> |
                <a href="quem-somos.html">Quem Somos</a> |
                <a href="contato.html">Contato</a> |
                <a href="destinos.html">Destinos</a> |
                <a href="buscar-pacotes.html">Buscar Pacotes</a> |
                <a href="cadastro.html">Cadastre-se</a>
            </td>
        </tr>
    </table>

    <!-- Formulário de cadastro -->
    <table border="1" width="50%" align="center" cellpadding="10" cellspacing="5">
        <tr>
            <td colspan="2" align="center"><h1>Cadastre-se</h1></td>
        </tr>
        <tr>
            <td><label for="nome">Nome Completo:</label></td>
            <td><input type="text" id="nome" name="nome" required></td>
        </tr>
        <tr>
            <td><label for="email">E-mail:</label></td>
            <td><input type="email" id="email" name="email" required></td>
        </tr>
        <tr>
            <td><label for="login">Login:</label></td>
            <td><input type="text" id="login" name="login" required></td>
        </tr>
        <tr>
            <td><label for="senha">Senha:</label></td>
            <td><input type="password" id="senha" name="senha" required></td>
        </tr>
        <tr>
            <td><label for="confirmarSenha">Confirmar Senha:</label></td>
            <td><input type="password" id="confirmarSenha" name="confirmarSenha" required></td>
        </tr>
        <tr>
            <td><label for="observacao">Observações:</label></td>
            <td><textarea id="observacao" name="observacao"></textarea></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <button type="submit">Enviar</button>
            </td>
        </tr>
    </table>

    <!-- Rodapé -->
    <table border="0" width="100%" cellpadding="10" cellspacing="5">
        <tr>
            <td align="center">
                <h4>Todos os direitos reservados</h4>
            </td>
        </tr>
    </table>

</body>

</html>
