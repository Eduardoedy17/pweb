<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 03 - API ViaCEP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/v4-shims.min.css"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="bg-correios-azul text-white p-3 mb-5 shadow-sm">
        <div class="container d-flex align-items-center">
            <h4 class="mb-0 ms-3">Buscador de endereços via CEP</h4>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-correios-amarelo">
                    <div class="card-body p-4 p-md-5">
                        
                        <form id="cepForm">
                            <div class="mb-3">
                                <label for="cep" class="form-label fw-bold">Digite seu CEP</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="cep" placeholder="00000-000" maxlength="9" required>
                                    <button class="btn btn-correios-amarelo" type="submit" id="search-button">
                                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                                        Buscar
                                    </button>
                                </div>
                                <div id="cep-error" class="text-danger mt-2" style="display: none;"></div>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div id="address-result" style="display: none;">
                            <h5 class="mb-3">Resultado da Busca</h5>
                            <div class="mb-2">
                                <label class="form-label small text-muted">Logradouro/Nome</label>
                                <input type="text" id="logradouro" class="form-control" readonly>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small text-muted">Bairro/Distrito</label>
                                <input type="text" id="bairro" class="form-control" readonly>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small text-muted">Localidade/UF</label>
                                <div class="input-group">
                                    <input type="text" id="cidade" class="form-control" readonly>
                                    <span class="input-group-text" style="width: 70px;" id="uf"></span>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small text-muted">Código IBGE</label>
                                <input type="text" id="ibge" class="form-control" readonly>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
