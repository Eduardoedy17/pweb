<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <title>Tabelas</title>
</head>

<body>

    <h1>Tabelas</h1> <!--h1 = Cabeçalho em Negrito-->

    <table border="1" bgcolor="F5F5F5" cellpadding="10" cellspacing="5">
        <tr>
            <td><img src="https://cdn.autopapo.com.br/box/uploads/2020/03/06220409/carros-esportivos-bugatti-chrion-pur-sport.png" width="100px"></td>
            <td>Coluna 02 - Linha 01</td>
        </tr>
        <tr>
            <td>Coluna 01 - Linha 02</td>
            <td>Coluna 02 - Linha 02</td>
        </tr>
    </table>

    <hr>

    <h1>Listagem de Produtos</h1>

    <table border="1" width="50%" bgcolor="F5F5F5" cellpadding="10" cellspacing="5">
        <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Valor (R$)</th>
        </tr>
        <tr>
            <td>00001</td>
            <td>Notebook</td>
            <td>2500,00</td>
        </tr>
        <tr>
            <td>00002</td>
            <td>Monitor</td>
            <td>500,00</td>
        </tr>
        <tr>
            <td>00003</td>
            <td>Roteador Wi-Fi</td>
            <td>150,00</td>
        </tr>
        <tr>
            <td colspan="2"><b>Total</b></td>
            <td>3150,00</td>
        </tr>
        <tr>
            <td rowspan="2"><b>Encargos</b></td>
            <td>Juros</td>
            <td>5,00</td>
        </tr>
        <tr>
            <td>Multa</td>
            <td>9,00</td>
        </tr>
        <tr>
            <td colspan="2"><b>Total Geral</b></td>
            <td>3164,00</td>
        </tr>
    </table>

    <hr>

    <h1>Desafio</h1>

    <table border="1" width="50%" bgcolor="F5F5F5" cellpadding="10" cellspacing="5">

        <tr>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td colspan="2"></td>
            <td></td>
        </tr>

        <tr>
            <td colspan="2"></td>
            <td></td>
        </tr>

        <tr>
            <td colspan="2"></td>
            <td></td>
        </tr>

    </table>

</body>

</html>
