<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Atributo Data - Eduardo Sousa</title>

<script type="text/javascript">

    function mostravalor(componente){
        // Usamos a propriedade .textContent para pegar o nome dentro da tag <li>
        var nome = componente.textContent;
        alert(nome);
    }
</script>

    <style>
        .pessoa {
            /* Aplicando uma cor a todos os itens */
            color: red;
            cursor: pointer;
            list-style: none; /* Adicionado para remover os marcadores */
        }

        /*
            Seletor de atributo que formata de forma diferente
            a pessoa com idade igual a 30
        */
        .pessoa[data-idade="30"] {
            color: blue;
        }

        /*
            Uso do ::before para inserir um conteúdo antes do elemento
        */
        .pessoa::before {
            content: '• Nome: ';
        }
        
        /*
            Uso do ::after e da função attr() para exibir o valor dos atributos
            personalizados 'data-idade' e 'data-cpf'
        */
        .pessoa::after {
            content: ' - Idade: ' attr(data-idade) ' Anos - C.P.F: ' attr(data-cpf);
        }

    </style>
</head>

<body>

    <header>
        <h1>Atributo Data</h1>
    </header>

    <ul>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="20" data-cpf="999">João</li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="30" data-cpf="888">José</li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="40" data-cpf="777">Maria</li>
    </ul>

</body>

</html>
