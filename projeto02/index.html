<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-navigation">
        <button type="button" class="btn btn-primary"><i class="bi bi-clock-history"></i> Pedidos Recentes</button>
        <button type="button" class="btn btn-primary"><i class="bi bi-person-plus"></i> Enviar Cliente</button>
        <button type="button" class="btn btn-primary"><i class="bi bi-cash-coin"></i> Receber Pagamento</button>
        <button type="button" class="btn btn-primary"><i class="bi bi-list-ul"></i> Todos os Pedidos</button>
        <button type="button" class="btn btn-primary"><i class="bi bi-plus-square"></i> Novo Pedido</button>
        <button type="button" class="btn btn-primary"><i class="bi bi-house-door"></i> Página Principal</button>


    </header>

    <main class="container-fluid">
        <section id="product-search-section">
            <h3 class="section-title">
                Pesquisa de Produtos
                 <button type="button" class="btn-close" aria-label="Close" style="position: absolute; right: 0.5rem;"></button>

            </h3>
            <form id="search-form">
                <div class="mb-3">
                    <label for="input-descricao" class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="input-descricao" placeholder="Digite o nome do produto...">
                </div>
                <div class="d-flex justify-content-start gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Pesquisar
                    </button>
                    <button type="reset" class="btn btn-primary">
                        <i class="bi bi-arrow-clockwise"></i> Limpar
                    </button>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#product-modal">
                        <i class="bi bi-plus-lg"></i> Novo Produto
                    </button>
                </div>
            </form>
        </section>

        <section id="product-table-section">
            <div class="table-options">
                <div class="d-flex align-items-center">
                    <label for="records-per-page" class="form-label me-2">Registros:</label>
                    <select class="form-select form-select-sm" id="records-per-page">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">ID <i class="bi bi-arrow-up"></i></th>
                            <th scope="col">Descrição <i class="bi bi-arrow-up"></i></th>
                            <th scope="col">Situação</th>
                            <th scope="col" class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="product-modal-label">Cadastrar Novo Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="product-form">
                    <div class="modal-body">
                        <input type="hidden" id="product-id">
                        <div class="mb-3">
                            <label for="product-name" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="product-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="product-status" class="form-label">Situação</label>
                            <select class="form-select" id="product-status" required>
                                <option value="Ativo" selected>Ativo</option>
                                <option value="Inativo">Inativo</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirm-delete-modal" tabindex="-1" aria-labelledby="confirm-delete-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirm-delete-label">Confirmar Remoção</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Deseja realmente remover este registro?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Sim, remover</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
