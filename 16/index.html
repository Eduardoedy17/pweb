<!doctype html> <!-- Define o tipo de documento como HTML5 -->

<html lang="pt-BR"> <!-- Inicia o documento HTML e define o idioma como português do Brasil -->

<head>
    <meta charset="utf-8"> <!-- Define o conjunto de caracteres para UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Torna o layout responsivo em dispositivos móveis -->
    <title>Design Responsivo Bootstrap</title> <!-- Título da aba do navegador -->

    <!-- Bootstrap CSS via CDN (versão 5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones do Bootstrap (via CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Arquivo CSS normalize (ajusta estilos padrão dos navegadores) -->
    <link rel="stylesheet" href="normalize.css">

    <!-- Arquivo local do Bootstrap (duplicado do CDN acima, talvez desnecessário) -->
    <link rel="stylesheet" href="/bootstrap-5.3.7-dist/css/bootstrap.min.css">
</head>

<body>
    <!-- Container Bootstrap com padding vertical -->
    <div class="container py-4">

        <!-- Seção com margem inferior, padding, fundo claro e borda arredondada -->
        <section class="mb-5 p-4 bg-light border rounded-3">
            <h1>Hello, world!</h1> <!-- Título principal -->
            <button class="btn btn-danger">
                <i class="bi bi-exclamation-triangle"></i> <!-- Ícone de alerta -->
                Teste
            </button> <!-- Botão vermelho com ícone -->
        </section>

        <!-- Seção com botões de ações principais -->
        <section class="mb-5">
            <h2>Botões de Ação</h2> <!-- Subtítulo -->
            <div>
                <!-- Botões com ícones do Bootstrap -->
                <button class="btn btn-primary"><i class="bi bi-search"></i> Pesquisar</button>
                <button class="btn btn-primary"><i class="bi bi-trash"></i> Excluir</button>
                <button class="btn btn-primary"><i class="bi bi-arrow-clockwise"></i> Atualizar</button>
            </div>
        </section>

        <!-- Seção com botões do tipo "outline" (bordas ao invés de fundo) -->
        <section class="mb-5">
            <h2>Botões Estilo "Outline"</h2>
            <div class="d-flex flex-wrap gap-2"> <!-- Layout flexível com espaçamento -->
                <!-- Vários botões com diferentes cores e estilos -->
                <button type="button" class="btn btn-outline-primary">Primary</button>
                <button type="button" class="btn btn-outline-secondary">Secondary</button>
                <button type="button" class="btn btn-outline-success">Success</button>
                <button type="button" class="btn btn-outline-info">Info</button>
                <button type="button" class="btn btn-outline-warning">Warning</button>
                <button type="button" class="btn btn-outline-danger">Danger</button>
                <button type="button" class="btn btn-outline-dark">Dark</button>
                <button type="button" class="btn btn-outline-light text-dark">Light</button>

                <!-- Botão que abre o modal -->
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
                    <i class="bi bi-box-arrow-up-right"></i> Open modal
                </button>
            </div>
        </section>

        <!-- Seção final com botões de navegação -->
        <section class="mt-5 text-center"> <!-- Margem no topo e centralização do texto -->
            <h3>Navegação</h3>
            <a href="../16.02/exercicio.html" class="btn btn-outline-success">Exercício 1</a>
            <a href="../16.02/exercicio1.html" class="btn btn-outline-success">Exercício 2</a>
        </section>
    </div>

    <!-- Modal oculto que é exibido ao clicar no botão -->
    <div class="modal fade" id="myModal"> <!-- Modal com efeito fade -->
        <div class="modal-dialog modal-dialog-centered"> <!-- Modal centralizado na tela -->
            <div class="modal-content"> <!-- Conteúdo do modal -->

                <!-- Cabeçalho do modal -->
                <div class="modal-header">
                    <h4 class="modal-title">Título do Modal</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button> <!-- Botão para fechar -->
                </div>

                <!-- Corpo principal do modal -->
                <div class="modal-body">
                    O corpo do modal aparece aqui. Você pode adicionar qualquer conteúdo HTML.
                </div>

                <!-- Rodapé com botões de ação -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary">Salvar Mudanças</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Script do Bootstrap para interatividade dos componentes -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
