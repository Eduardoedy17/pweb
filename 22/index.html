<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>

    <!-- Links CSS originais (mantidos sem alteração) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./bootstrap-5.3.7-dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Scripts JS originais do head (mantidos sem alteração) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>

    <!-- Estilos CSS internos originais (mantidos sem alteração) -->
    <style>
        /* Define um estilo para o corpo da página */
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        /* Estilo para os botões */
        .botao-exercicio {
            display: block;
            /* Faz com que cada botão ocupe uma linha inteira, empilhando-os */
            width: 120px;
            /* Define uma largura fixa para os botões */
            padding: 5px;
            /* Adiciona um espaçamento interno */
            margin-bottom: 10px;
            /* Adiciona uma margem na parte inferior para separá-los */
        }
    </style>
</head>

<body>

    <h1>JavaScript</h1>

    <div style="margin: 10px;">
        <button onclick="minhafuncao(10,20)">Clique</button>
    </div>

    <div style="margin: 10px;">
        <button onclick="escreve('<h1>PROGRAMAÇÃO WEB</h1>')">Escreve</button>
    </div>

    <hr />

    <h1>Raiz Quadrada</h1>

    <button class="botao-exercicio" onclick="calcularRaiz(25)">Raiz de 25</button>
    <button class="botao-exercicio" onclick="calcularRaiz(36)">Raiz de 36</button>
    <button class="botao-exercicio" onclick="calcularRaiz(49)">Raiz de 49</button>

    <hr />

    <h1>Escrevendo na Div</h1>

    <button class="botao-exercicio" onclick="escreveDiv1('Texto escrito na div 1')">Escrever</button>

    <div id="minhaDiv1"></div>

    <hr />

    <h1>Escrevendo no Texto Dinamico</h1>

    <button class="botao-exercicio" onclick="escreveDiv2()">Escrever</button>

    <hr />

    <h1>Desafio - Escrever de 1 a N</h1>

    <button class="botao-exercicio" onclick="iniciarContagem()">Iniciar Contagem</button>

    <div id="resultado" class="mt-3">
        <p>A contagem aparecerá aqui...</p>
    </div>

    <!-- TODOS OS SCRIPTS FORAM AGRUPADOS AQUI NO FINAL DO BODY -->

    <!-- Script externo do desafio -->
    <script src="script.js"></script>

    <!-- Scripts que estavam no <head> e no <body>, agora agrupados -->
    <script type="text/javascript">
        /**
         * Calcula a raiz quadrada de um número e exibe o resultado em um alerta.
         * @param {number} numero - O número para o qual a raiz quadrada será calculada.
         */
        function calcularRaiz(numero) {
            // Utiliza a função Math.sqrt() para calcular a raiz quadrada.
            var raiz = Math.sqrt(numero);

            // Cria a mensagem que será exibida no alerta.
            var msg = 'A raiz quadrada de ' + numero + ' é ' + raiz;

            // Exibe um alerta com a mensagem formatada.
            alert(msg);
        }

        function escreveDiv2() {
            texto = prompt('Digite um texto qualquer: ');
            // Solicita ao usuário que digite um texto para ser escrito na div 2
            // A função original tinha uma segunda definição que foi mesclada aqui.
            // A segunda definição chamava escreveDiv1(texto), que foi adicionada abaixo.
            escreveDiv1(texto);
        }

        function minhafuncao(arg1, arg2) {

            var msg = 'A soma é igual a ';
            // Cria uma variável chamada msg que armazena a string 'A soma é igual a '
            // e concatena com o resultado da soma dos argumentos arg1 e arg2

            var soma = arg1 + arg2;
            // Cria uma variável chamada soma que armazena a soma dos argumentos arg1 e arg2
            // Exibe um alerta com a mensagem concatenada com o resultado da soma
            // A função alert exibe uma caixa de diálogo com a mensagem e o resultado da soma 
            alert(msg + soma);
        }

        function escreve(arg) {
            document.write(arg);
        }

        function escreveDiv1(texto) {
            document.getElementById('minhaDiv1').innerHTML = texto;
            // Escreve o texto digitado pelo usuário na div 1
        }
    </script>

</body>

</html>
