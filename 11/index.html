<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Semântico</title>
    <link rel="stylesheet" href="estiloshtml5.css">
</head>
<body>

    <div class="container">
        <header class="box">&lt;header&gt;</header>
        
        <div class="middle-section">
            <nav class="box">&lt;nav&gt;</nav>
            
            <main class="box main-content">
                
                <section class="box inner-section">
                    <header class="box sub-box">&lt;header&gt;</header>
                    <article class="box sub-box article-box">&lt;article&gt;</article>
                    <footer class="box sub-box">&lt;footer&gt;</footer>
                </section>

                <section class="box inner-section">
                    <header class="box sub-box">&lt;header&gt;</header>
                    <article class="box sub-box article-box">&lt;article&gt;</article>
                    <footer class="box sub-box">&lt;footer&gt;</footer>
                </section>

                <section class="box inner-section">
                    <header class="box sub-box">&lt;header&gt;</header>
                    <article class="box sub-box article-box">&lt;article&gt;</article>
                    <footer class="box sub-box">&lt;footer&gt;</footer>
                </section>
                
                <section class="box inner-section">
                    <header class="box sub-box">&lt;header&gt;</header>
                    <article class="box sub-box article-box">&lt;article&gt;</article>
                    <footer class="box sub-box">&lt;footer&gt;</footer>
                </section>

            </main>

            <aside class="box">&lt;aside&gt;</aside>
        </div>
        
        <footer class="box">&lt;footer&gt;</footer>
    </div>

</body>
</html>
