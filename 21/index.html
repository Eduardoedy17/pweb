<!DOCTYPE html> <!-- Define que o documento é HTML5 -->
<html lang="pt-br"> <!-- Define o idioma principal da página como português brasileiro -->

<head>
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividade: ajusta o layout para dispositivos diferentes -->
    <title>Bootstrap: Alertas, Tooltips e Popovers</title> <!-- Título que será exibido na aba do navegador -->
    
    <!-- Importa o CSS do Bootstrap para estilos e componentes responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Importa o Font Awesome para uso de ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container py-5"> <!-- Container centralizado com espaçamento vertical -->

        <div class="mb-5"> <!-- Margem inferior para separar o bloco -->
            <h2 class="mb-3">Alertas com Ícones</h2> <!-- Título da seção -->

            <!-- Alerta de sucesso com ícone e botão para fechar -->
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-check-circle me-2"></i> <!-- Ícone de sucesso com margem à direita -->
                <strong>Sucesso!</strong> Sua ação foi concluída com êxito.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button> <!-- Botão que fecha o alerta -->
            </div>

            <!-- Alerta informativo -->
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-info me-2"></i>
                <strong>Aviso!</strong> Esta é uma notificação informativa.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Alerta de aviso -->
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <strong>Atenção!</strong> Verifique os dados inseridos.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Alerta de erro -->
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-xmark me-2"></i>
                <strong>Perigo!</strong> Ocorreu um erro perigoso.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <hr> <!-- Linha horizontal para separar seções -->

        <div class="my-5"> <!-- Margem vertical para espaçamento -->
            <h2 class="mb-3">Tooltips</h2> <!-- Título da seção -->

            <!-- Botão que exibe um tooltip ao passar o mouse -->
            <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="right"
                title="Detalhes do Item">Dica</button>

            <!-- Grupo de botões com ícones que mostram tooltips -->
            <div class="btn-group ms-3">
                <button type="button" class="btn btn-outline-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Play">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Pause">
                    <i class="fa-solid fa-pause"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Stop">
                    <i class="fa-solid fa-stop"></i>
                </button>
            </div>
        </div>

        <hr>

        <div class="my-5">
            <h2 class="mb-3">Popover</h2> <!-- Título da seção de Popover -->

            <!-- Botão que exibe um popover ao receber foco -->
            <button type="button" class="btn btn-lg btn-danger" data-bs-toggle="popover" title="Detalhes!!!"
                data-bs-content="Breve detalhes aqui!"
                data-bs-placement="right" data-bs-trigger="focus">
                Clique para ver detalhes
            </button>
        </div>
    </div>

    <!-- Importa o JavaScript do Bootstrap (inclui suporte aos tooltips e popovers) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Ativa todos os tooltips no documento
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        const tooltipList = [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));

        // Ativa todos os popovers no documento
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        const popoverList = [...popoverTriggerList].map(el => new bootstrap.Popover(el));
    </script>
</body>

</html>
