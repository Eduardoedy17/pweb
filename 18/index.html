<!doctype html> <!-- Define o tipo de documento como HTML5 -->

<html lang="pt-BR"> <!-- Início do documento HTML, com o idioma definido como português brasileiro -->

<head>
  <meta charset="utf-8">
  <!-- Define a codificação de caracteres para UTF-8, permitindo acentuação e caracteres especiais -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Torna a página responsiva, adaptável a telas menores -->
  <title>Formulários e Tabelas</title> <!-- Título que aparece na aba do navegador -->

  <!-- Importa o CSS do Bootstrap via CDN para utilizar os estilos e componentes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Importa o arquivo normalize.css para remover inconsistências de estilo entre navegadores -->
  <link rel="stylesheet" href="normalize.css">
</head>

<body>
  <!-- Container central com margem automática e espaçamento interno -->
  <div class="container" style="padding: 40px;">

    <!-- Define uma linha do grid do Bootstrap -->
    <div class="row">

      <!-- Coluna com largura de 8 unidades em telas pequenas (máximo 12 por linha) -->
      <div class="col-sm-8">
        <h1>Cadastre-se</h1> <!-- Título da seção de cadastro -->

        <!-- Início do formulário de nome -->
        <form>
          <div class="form-group"> <!-- Agrupa label e input para formatação com Bootstrap -->
            <label for="nome">Nome:</label> <!-- Rótulo associado ao campo de nome -->
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome"> <!-- Campo de texto -->
          </div>
        </form>

        <!-- Formulário separado para o email -->
        <form>
          <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
          </div>
        </form>

        <!-- Formulário separado para senha -->
        <form>
          <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
          </div>
        </form>

        <!-- Campo com checkbox (marcar aceite dos termos) -->
        <div class="checkbox">
          <label>
            <input type="checkbox"> Aceito os termos do serviço.
          </label>
        </div>

        <!-- Grupo de opções com radio buttons (escolher linguagem preferida) -->
        <div class="radio">
          <label>
            <input type="radio" name="opcoes"> PHP <!-- Atribuição do mesmo name agrupa os botões -->
          </label>

          <label>
            <input type="radio" name="opcoes"> Java
          </label>
        </div>

        <!-- Botão de envio do formulário de cadastro -->
        <button style="padding: 10px 20px;" type="submit" class="btn btn-default">Cadastrar</button>
      </div>

      <!-- Coluna menor para área de login -->
      <div class="col-sm-4">
        <h1>Logar</h1> <!-- Título da área de login -->

        <!-- Campo de e-mail para login -->
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
        </div>

        <!-- Campo de senha para login -->
        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
        </div>

        <!-- Botão de login com estilo primário do Bootstrap -->
        <div class="form-group" style="padding: 10px 20px;">
          <button type="submit" class="btn btn-primary">Logar</button>
        </div>
      </div>
    </div> <!-- Fim da linha -->
  </div> <!-- Fim do container -->

  <div class="container">
    <h1>Tabelas no Bootstrap</h1> <!-- Título da seção de produtos -->

    <!-- Tabela estilizada com Bootstrap -->
    <table class="table table-striped table-hover table-condensed">
      <!-- Tabela com estilo listrado, interativo e compactado -->
      <thead>
        <tr>
          <th>Produto</th>
          <th>Fabricante</th>
          <th>Preço</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Notebook 980</td>
          <td>HP</td>
          <td>R$ 1.800,00</td>
        </tr>

        <tr>
          <td>Macbook Air</td>
          <td>Apple</td>
          <td>R$ 4.800,00</td>
        </tr>

        <tr>
          <td>HP Pavilion 980</td>
          <td>HP</td>
          <td>R$ 2.800,00</td>
        </tr>
      </tbody>
    </table>

    <!-- Importa os scripts JS do Bootstrap para funcionalidades como validação, modais, etc. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
