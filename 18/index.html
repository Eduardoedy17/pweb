<!doctype html> <!-- Define que o documento segue o padrão HTML5 -->

<html lang="pt-BR"> <!-- Início do HTML, idioma definido como português brasileiro -->

<head>
  <meta charset="utf-8"> <!-- Define a codificação para UTF-8 (suporta acentos e caracteres especiais) -->

  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Faz o layout responder ao tamanho da tela -->

  <title>Formulários e Tabelas</title> <!-- Título exibido na aba do navegador -->

  <!-- Link para o CSS do Bootstrap versão 5.3.3 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Link para o normalize.css para uniformizar estilos entre navegadores -->
  <link rel="stylesheet" href="normalize.css">
</head>

<body>

  <!-- Container Bootstrap com padding adicional -->
  <div class="container" style="padding: 40px;">

    <!-- Linha do grid Bootstrap (agrupa colunas horizontalmente) -->
    <div class="row">

      <!-- Coluna maior com 8 unidades de largura para o formulário de cadastro -->
      <div class="col-sm-8">
        <h1>Cadastre-se</h1>

        <!-- Formulário com campo Nome -->
        <form>
          <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
          </div>
        </form>

        <!-- Formulário com campo E-mail -->
        <form>
          <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
          </div>
        </form>

        <!-- Formulário com campo Senha -->
        <form>
          <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
          </div>
        </form>

        <!-- Aceite dos termos via checkbox -->
        <div class="checkbox">
          <label>
            <input type="checkbox"> Aceito os termos do serviço.
          </label>
        </div>

        <!-- Escolha entre opções via radio buttons -->
        <div class="radio">
          <label>
            <input type="radio" name="opcoes"> PHP
          </label>

          <label>
            <input type="radio" name="opcoes"> Java
          </label>
        </div>

        <!-- Botão para envio do cadastro -->
        <button style="padding: 10px 20px;" type="submit" class="btn btn-default">Cadastrar</button>
        <!-- Obs: 'btn-default' não existe no Bootstrap 5, pode ser substituído por 'btn-secondary' -->
      </div>

      <!-- Coluna menor com 4 unidades para o login -->
      <div class="col-sm-4">
        <h1>Logar</h1>

        <!-- Campo de e-mail -->
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
        </div>

        <!-- Campo de senha -->
        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
        </div>

        <!-- Botão para logar -->
        <div class="form-group" style="padding: 10px 20px;">
          <button type="submit" class="btn btn-primary">Logar</button>
        </div>
      </div>
    </div> <!-- Fim da linha da grade Bootstrap -->
  </div> <!-- Fim do container principal -->

  <!-- Novo container para a tabela de produtos -->
  <div class="container">
    <h1>Tabelas no Bootstrap</h1> <!-- Título da seção de tabela -->

    <!-- Tabela estilizada com Bootstrap -->
    <table class="table table-striped table-hover table-condensed">
      <!-- table-striped: alterna cores de linha
           table-hover: destaca ao passar o mouse
           table-condensed: reduz o espaçamento (não está mais disponível no Bootstrap 5) -->

      <thead> <!-- Cabeçalho da tabela -->
        <tr>
          <th>Produto</th>
          <th>Fabricante</th>
          <th>Preço</th>
        </tr>
      </thead>

      <tbody> <!-- Corpo da tabela com dados -->
        <tr>
          <td>Notebook 980</td>
          <td>HP</td>
          <td>R$ 1.800,00</td>
        </tr>

        <tr>
          <td>Macbook Air</td>
          <td>Apple</td>
          <td>R$ 4.800,00</td>
        </tr>

        <tr>
          <td>HP Pavilion 980</td>
          <td>HP</td>
          <td>R$ 2.800,00</td>
        </tr>
      </tbody>
    </table>
  </div> <!-- Fim do container da tabela -->

  <!-- Script JS do Bootstrap para ativar componentes interativos -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
