<!doctype html> <!-- Define que o documento é do tipo HTML5 -->
<html lang="pt-br"> <!-- Início da estrutura HTML, define o idioma como português do Brasil -->

<head>
    <meta charset="utf-8"> <!-- Define a codificação dos caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Configura a visualização em dispositivos móveis -->
    <title> Botão de navegação </title> <!-- Define o título da página que aparece na aba do navegador -->

    <!-- Importa um arquivo CSS local chamado style.css -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Importa a biblioteca de ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Importa a biblioteca de estilos do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Barra de navegação responsiva utilizando componentes do Bootstrap -->
    <nav class="navbar navbar-expand-md navbar-light bg-red-white-text">
        <div class="container-fluid"> <!-- Container que ocupa toda a largura da tela -->

            <!-- Logo ou nome do site -->
            <a class="navbar-brand" href="#">C-sharp Corner</a>
            
            <!-- Botão que aparece em telas menores para abrir/fechar o menu -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span> <!-- Ícone do botão -->
            </button>
            
            <!-- Menu de navegação colapsável (abre/fecha) -->
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto"> <!-- Lista de links alinhada à direita -->
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a> <!-- Link para a página inicial -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a> <!-- Link para a seção "Sobre nós" -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Technology</a> <!-- Link para a seção de tecnologia -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a> <!-- Link para a seção de contato -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Seção de navegação adicional com botão de acesso ao desafio -->
    <section class="mt-5 text-center"> <!-- Margem superior + alinhamento centralizado -->
        <h3>Navegação</h3> <!-- Título da seção -->
        <a href="./desafio.html" class="btn btn-outline-success">Desafio</a> <!-- Botão estilizado que leva ao desafio -->
    </section>

    <!-- Script do Bootstrap que permite o funcionamento dos componentes interativos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
