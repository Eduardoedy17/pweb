<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Responsivo</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/estilo.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
    crossorigin="anonymous"
  />
  <style>
    .menu-item {
      background-color: #13215f;
      color: #fff;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .menu-item:hover {
      background-color: #2888d6;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .menu-item {
        background-color: #6edd6e;
      }

      .menu-item:hover {
        background-color: #4cbf4c;
      }
    }
  </style>
</head>

<body class="container py-4">
  <ul class="d-flex flex-wrap flex-md-row flex-column list-unstyled">
    <li class="menu-item">Menu 01</li>
    <li class="menu-item">Menu 02</li>
    <li class="menu-item">Menu 03</li>
    <li class="menu-item">Menu 04</li>
    <li class="menu-item">Menu 05</li>
  </ul>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>

</html>
