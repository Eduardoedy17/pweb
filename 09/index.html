<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Box Model e Posicionamentos - Corrigido</title>
    <style>
        body {
            background: #61bd8c;
            /* Adicionado position: relative para servir de contexto ao #absoluto */
            position: relative; 
            font-family: sans-serif;
        }

        /* Rótulo "Container body" */
        #body-label {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: bold;
            color: #333;
        }

        #conteudo {
            background: #FFFFFF;
            padding: 10px;
            width: 500px;
            /* A margem empurra o container para a direita */
            margin: 80px 50px 30px auto;
            min-height: 250px; /* Garante altura mínima */
            position: relative; /* Contexto para o rótulo "Container div" */
        }

        /* Rótulo "Container div" */
        #div-label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }

        .caixa {
            background: red;
            margin: 10px;
            width: 100px;
            height: 100px;
            color: #FFFFFF;
            /* Centraliza o texto dentro da caixa */
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            text-align: center; /* Garante alinhamento do texto */
        }

        /* Posicionamento Relativo (dentro do #conteudo) */
        #relativo {
            position: relative;
            /* Deslocado em relação à sua posição original */
            top: 10px;
            left: 20px;
        }

        /* Posicionamento Absoluto (em relação ao body) */
        #absoluto {
            position: absolute;
            top: 250px;
            left: 80px;
        }

        /* Posicionamento Fixo (em relação à janela do navegador) */
        #fixo {
            position: fixed;
            top: 80px;
            left: 200px;
        }

        /* --- ESTILOS DO LINK DO EXERCÍCIO PRESERVADOS --- */
        #link-exercicio {
            background: #007bff; /* Azul vibrante para o link */
            color: white;
            width: 200px; /* Mais largo para o texto do link */
            height: auto; /* Altura automática para se ajustar ao conteúdo */
            padding: 15px; /* Espaçamento interno */
            position: relative; /* Mantém no fluxo normal, mas pode ser movido */
            left: 25%; /* Tenta centralizar a caixa dentro do #conteudo */
            border: 1px solid #0056b3;
            /* Remove a margem padrão da classe .caixa para melhor controle */
            margin-top: 30px; 
        }

        #link-exercicio a {
            color: white;
            text-decoration: none;
        }

        #link-exercicio a:hover {
            text-decoration: underline; /* Adiciona sublinhado ao passar o mouse */
        }

    </style>
</head>
<body>

    <span id="body-label">Container body</span>

    <div id="fixo" class="caixa">
        Fixo
    </div>

    <div id="absoluto" class="caixa">
        Absoluto
    </div>

    <div id="conteudo">
        <span id="div-label">Container div</span>

        <div id="relativo" class="caixa">
            Relativo
        </div>
        
        <div id="link-exercicio" class="caixa">
             <a target="_blank" href="../09.2/index.html">Exercício de Layout</a>
        </div>
    </div>

</body>
</html>
