<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model e Posicionamentos</title>
    <style>

        body {
            background: #61bd8c;
        }

        #conteudo {
            background: #FFFFFF;
            padding: 10px;
            width: 900px;
            margin: 30px auto;
         }

        .caixa {
            background: red; /* Cor padrão das caixas de exemplo */
            margin: 10px;
            width: 100px;
            height: 100px;
            color: #FFFFFF;
        }

        /* Posicionamento Relativo */
        #relativo {
            position: relative;
            left: 30px; /* Desloca 30px da posição normal à esquerda */
        }

        /* Posicionamento Absoluto */
        #absoluto {
            position: absolute; /* Posicionado em relação ao pai mais próximo com position: relative */
            left: 150px;
        }

        /* Posicionamento Fixo */
        #fixo {
            position: fixed; /* Posicionado em relação à viewport (janela do navegador) */
            right: 200px; /* 20px da borda direita da janela */
            top: 0px; /* 20px da borda superior da janela */
        }

        /* Estilo específico para a caixa do link do exercício */
        #link-exercicio { /* Novo ID para a caixa do link */
            background: #007bff; /* Azul vibrante para o link */
            color: white;
            width: 200px; /* Mais largo para o texto do link */
            height: auto; /* Altura automática para se ajustar ao conteúdo */
            position: relative; /* Mantém no fluxo normal, mas pode ser movido */
            left: 25%; /* Tenta centralizar a caixa dentro do #conteudo */
            border: 1px solid #0056b3;
        }

        #link-exercicio a:hover {
            text-decoration: underline; /* Adiciona sublinhado ao passar o mouse */
        }

        /* Estilos para o texto "Container body" e "Container div" */
        span {
            display: block; /* Para que o span ocupe uma linha inteira e o margin-top funcione */
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <span>Container body</span>

    <div id="conteudo">
        Container div

        <div id="relativo" class="caixa">
            Relativo
        </div>

        <div id="absoluto" class="caixa">
            Absoluto
        </div>

        <div id="fixo" class="caixa">
            Fixo
        </div>

        <div id="link-exercicio" class="caixa">
            <p><a target="_blank" href="../09.2/index.html">Exercício de Layout</a></p>
        </div>
    </div>

</body>
</html>
