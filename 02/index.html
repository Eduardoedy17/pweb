<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Atividade 02</title>

</head>

<body>

    <h1>Atividade 02</h1> <!--h1 = Cabeçalho em Negrito-->
    
    <hr> <!-- Linha horizontal -->

        Esta palavra está em <b>Negrito</b>

    <hr> <!-- Quebra de linha -->

        Persista com coragem, <br> <!-- Quebra de linha -->
        abraçando desafios.

    <hr> <!-- Quebra de linha -->

    <p>Persista com coragem,</p> <!-- Parágrafo --> 
    <p>abraçando desafios.</p> <!-- Parágrafo -->

    <hr> <!-- Quebra de linha -->

    <ul> <!-- Lista não ordenada -->
        <li>Item 1</li> <!-- Item da lista -->
        <li>Item 2</li> <!-- Item da lista -->
        <li>Item 3</li> <!-- Item da lista -->
    </ul>

    <hr> <!-- Quebra de linha -->

    <ol> <!-- Lista ordenada -->
        <li>Primeiro</li> <!-- Item da lista -->
        <li>Segundo</li> <!-- Item da lista -->
        <li>Terceiro</li> <!-- Item da lista -->
    </ol>

    <hr> <!-- Quebra de linha -->

    <img height="60px" src="https://www.ifpi.edu.br/topo_ifpi.png"> <!-- Imagem -->
